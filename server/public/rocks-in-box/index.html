<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phame</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; font: 13px/1.45 system-ui, sans-serif; color: #cfd3e6; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 12px; top: 10px; padding: 8px 11px; border-radius: 8px; background: rgba(10, 12, 24, .7); backdrop-filter: blur(6px); pointer-events: none; min-width: 15rem; white-space: pre; }
  #hud b { color: #ffd77a; font-weight: 600; }
  #hud .k { color: #8890b0; }
  #help { position: fixed; right: 12px; bottom: 10px; color: #8890b0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Connecting…</div>
<div id="help">drag to orbit · wheel or pinch to zoom · double-click, double-tap or space to throw a ragdoll</div>
<script type="module">
'use strict';
// Rocks in a box, on phame.js: the engine's one browser runtime (see /phame.js and docs/REMOTE-VIEW.md), the same
// one the solar system demo uses. This page has no rendering code at all - it loads phame.js, tells it the camera
// starts a bit back from the middle of the box, sends its own camera position as this viewer's avatar (RocksGame
// shows other viewers' Observer meshes moving - that is this game's input, not phame.js's rendering camera), and
// throws a ragdoll on request. Everything about what a rock, a marble or an avatar looks like is server-side
// (RocksGame.php's Mesh/Material tree) - this page never mentions them.
import { connect } from '../phame.js';

const hud = document.getElementById('hud');
const game = connect((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/\/?$/, '/') + 'ws', {
  canvas: document.getElementById('c'), near: 0.05, far: 2000, startDistance: 150, maxDistance: 450,
});
game.camera.target(null);      // orbit the box's centre - this viewer's own position, not a body to look at
game.camera.distance = 150;
game.camera.yaw = Math.random() * 2 * Math.PI;   // a random side, so two new tabs do not sit inside each other
game.camera.pitch = 0.32;

// ---------- this viewer's camera is also their avatar in the world: send it to the game at most 30 times a second,
// and only when it actually moved (RocksGame.Observer::moved() is what every other viewer sees)
let sentEye = null, sentAt = 0;
game.on('tick', () => {
  const now = performance.now();
  if (now - sentAt < 33) return;
  const eye = game.cameraPosition;
  if (sentEye && Math.hypot(eye[0]-sentEye[0], eye[1]-sentEye[1], eye[2]-sentEye[2]) < 0.01) return;
  const yaw = game.camera.yaw, pitch = game.camera.pitch;
  const [sy, cy, sp, cp] = [Math.sin(yaw / 2), Math.cos(yaw / 2), Math.sin(-pitch / 2), Math.cos(-pitch / 2)];
  game.send({ type: 'camera', p: eye, q: [cy * sp, sy * cp, -sy * sp, cy * cp] });
  sentEye = eye; sentAt = now;
});

// ---------- dropping a ragdoll: a mouse double-click, a touch double-tap (phame.js's own drag handling already
// claims single taps for orbiting, so this page only needs to notice two quick, nearby touches), or space
function drop() { game.send({ type: 'drop' }); }
document.getElementById('c').addEventListener('dblclick', drop);
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); drop(); } });
let lastTap = null;
document.getElementById('c').addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse') return;
  const now = performance.now();
  if (lastTap && now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { lastTap = null; drop(); return; }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
});

// ---------- HUD, throttled: game.nodes() copies the whole node list, cheap at 5 Hz but not worth doing every frame
let lastHudAt = 0, bodyCount = 0;
game.on('snapshot', () => bodyCount = game.nodes.length);
game.on('add', () => bodyCount = game.nodes.length);
game.on('remove', () => bodyCount = game.nodes.length);
game.on('tick', () => {
  const now = performance.now();
  if (now - lastHudAt < 200) return;
  lastHudAt = now;
  const s = game.stats;
  hud.innerHTML = `<b>Phame</b> · rocks and glass in a box, simulated in PHP\n` +
    (s.worker ? `<span class="k">your socket's worker</span> ${s.worker}\n` : '') +
    `<span class="k">bodies</span> ${bodyCount} · <span class="k">fps</span> ${s.fps.toFixed(0)}\n` +
    `<span class="k">round trip</span> ${(s.rtt * 1000).toFixed(1)} ms\n` +
    `<span class="k">descriptions</span> ${s.dps.toFixed(0)}/s · ${(s.bps / 1024).toFixed(1)} KB/s\n` +
    `<span class="k">socket</span> ${game.socketState}`;
});
</script>
</body>
</html>
