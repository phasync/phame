<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar system war</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000103; overflow: hidden; font: 13px/1.45 system-ui, sans-serif; color: #cfd3e6; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 12px; top: 10px; padding: 8px 11px; border-radius: 8px; background: rgba(10, 12, 24, .72); backdrop-filter: blur(6px); white-space: pre; pointer-events: none; min-width: 15rem; z-index: 3; }
  #hud b { color: #ffd77a; font-weight: 600; }
  #hud .k { color: #8890b0; }
  .phame-label { cursor: pointer; padding: 2px 5px; }
  .phame-label:hover { color: #ffd77a; }
  #panel { position: fixed; right: 10px; bottom: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(10, 12, 24, .72); backdrop-filter: blur(6px); max-width: 280px; z-index: 3; }
  #panel .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #panel button { background: #1b2040; color: #cfd3e6; border: 1px solid #38406e; border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #panel button:hover { background: #2a2f58; }
  #panel input[type=range] { flex: 1; }
  #panel .time { color: #8890b0; font-size: 11px; }
  #help { position: fixed; left: 12px; bottom: 10px; color: #70769a; font-size: 11px; pointer-events: none; z-index: 3; }
  @media (max-width: 640px) {
    #hud { font-size: 12px; min-width: 11rem; }
    #panel { max-width: 46vw; font-size: 11px; }
    #help { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Connecting…</div>
<div id="panel">
  <div class="row"><b>Time</b> <span class="time" id="timeLabel">now</span></div>
  <div class="row">
    <button id="tMinusDay">-1d</button><button id="tMinusHour">-1h</button><button id="tNow">now</button><button id="tPlusHour">+1h</button><button id="tPlusDay">+1d</button>
  </div>
  <div class="row"><input id="tSlider" type="range" min="-720" max="720" step="1" value="0"></div>
  <div class="row"><button id="eclipse" style="flex:1">Next lunar eclipse</button></div>
</div>
<div id="help">drag to orbit · wheel/pinch to zoom · 0-9 or Tab: pick target · click a label · P: perf</div>
<script type="module">
'use strict';
// The Solar System War observer page. All rendering (the scene mirror, double-precision evaluation, the camera,
// instancing, the eclipse shader) is phame.js's job now - see /phame.js and docs/REMOTE-VIEW.md. This page only
// adds its own HUD, a target list built from the node names SolarSystem.php assigns, and the time-travel panel.
import { connect } from '../phame.js';

const hud = document.getElementById('hud');
const AU = 1.495978707e8; // km

// SolarSystem.php's bodies are a few hundred km across at the smallest (an asteroid) to ~1.4M km (the Sun): large
// enough above the noise of the ~10km position-refit error budget that "large body" reliably means "planet, moon
// or the Sun," never an asteroid - which is exactly the set the eclipse shader's occluder search should consider.
const game = connect((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/\/?$/, '/') + 'ws', {
  canvas: document.getElementById('c'), near: 1e-3, far: 2e11, startDistance: 50000, occluderMinRadius: 500,
});

// ---------- target list + labels: built from node names once the snapshot is in, refreshed on later adds (none
// expected here - SolarGame's scene is static in composition, only descriptions change)
const ORDER = ['Sun', 'Mercury', 'Venus', 'Earth', 'Moon', 'Mars', 'Phobos', 'Deimos', 'Jupiter', 'Io', 'Europa', 'Ganymede', 'Callisto', 'Saturn', 'Titan', 'Uranus', 'Neptune'];
let nameToId = new Map(), targetList = [], initialCameraSet = false;
function refreshTargets() {
  nameToId = new Map();
  for (const n of game.nodes) if (n.name) nameToId.set(n.name, n.id);
  targetList = ORDER.map(n => nameToId.get(n)).filter(id => id !== undefined);
  if (!initialCameraSet) setInitialCamera();
}
game.on('snapshot', refreshTargets);
game.on('add', refreshTargets);

function setInitialCamera() {
  const earth = nameToId.get('Earth'), moon = nameToId.get('Moon');
  if (earth === undefined) return;
  initialCameraSet = true;
  game.camera.target(earth);
  if (moon === undefined) return;
  // frame both Earth and the Moon: aim the camera from the far side of the pair, at a distance that fits both
  const pe = game.nodePosition(earth), pm = game.nodePosition(moon);
  const diff = [pm[0]-pe[0], pm[1]-pe[1], pm[2]-pe[2]], dist = Math.hypot(...diff);
  const dir = diff.map(v => v / (dist || 1));
  game.camera.distance = Math.max(dist * 0.85, 40000);
  game.camera.yaw = Math.atan2(-dir[0], -dir[2]);
  game.camera.pitch = Math.max(-1.4, Math.min(1.4, Math.asin(-dir[1])));
}

addEventListener('keydown', e => {
  if (e.code === 'Tab') { e.preventDefault(); if (targetList.length) { const i = targetList.indexOf(game.camera.targetId); game.camera.flyTo(targetList[(i + 1 + targetList.length) % targetList.length]); } return; }
  if (e.code >= 'Digit0' && e.code <= 'Digit9') {
    const names = ['Sun', 'Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Moon'];
    game.camera.flyTo(nameToId.get(names[parseInt(e.code.slice(5), 10)]));
  }
});
// a label (built by phame.js from this scene's Label nodes) flies the camera there on click - to the label's
// parent (the body it names), not the label itself, which has no geometry to size the flight's arrival distance by
game.on('labelclick', id => { const n = game.nodes.find(n => n.id === id); if (n) game.camera.flyTo(n.parentId); });

// ---------- time control panel
const tSlider = document.getElementById('tSlider'), timeLabel = document.getElementById('timeLabel');
function setOffsetHours(h) { game.timeOffset = h * 3600; tSlider.value = Math.max(-720, Math.min(720, h)); }
document.getElementById('tMinusDay').onclick = () => setOffsetHours(game.timeOffset / 3600 - 24);
document.getElementById('tMinusHour').onclick = () => setOffsetHours(game.timeOffset / 3600 - 1);
document.getElementById('tNow').onclick = () => setOffsetHours(0);
document.getElementById('tPlusHour').onclick = () => setOffsetHours(game.timeOffset / 3600 + 1);
document.getElementById('tPlusDay').onclick = () => setOffsetHours(game.timeOffset / 3600 + 24);
tSlider.oninput = () => { game.timeOffset = Number(tSlider.value) * 3600; };
document.getElementById('eclipse').onclick = () => {
  if (game.epoch === null) return;
  const eclipseUnix = Date.UTC(2026, 7, 28, 4, 13, 0) / 1000;
  game.timeOffset = (eclipseUnix - game.epoch) - (game.evalTime - game.timeOffset);
  setOffsetHours(game.timeOffset / 3600);
  const moon = nameToId.get('Moon');
  if (moon !== undefined) game.camera.flyTo(moon, 9000);
};

// ---------- HUD
let showPerf = false;
addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P') showPerf = !showPerf; });
function formatDistance(km) { return km > AU * 0.1 ? (km / AU).toFixed(3) + ' AU' : km.toLocaleString(undefined, { maximumFractionDigits: 0 }) + ' km'; }
game.on('tick', t => {
  const id = game.camera.targetId;
  const p = game.nodePosition(id), cam = game.cameraPosition;
  const dist = Math.hypot(p[0]-cam[0], p[1]-cam[1], p[2]-cam[2]);
  const date = game.epoch !== null ? new Date((game.epoch + t) * 1000).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '?';
  const s = game.stats;
  const perf = showPerf ? `\n<span class="k">dpr</span> ${s.dprCap.toFixed(2)} <span class="k">rtt</span> ${(s.rtt*1000).toFixed(0)}ms` : '';
  hud.innerHTML = `<b>phasync+Phame: Tech preview</b>\n` +
    `<span class="k">target</span> ${game.nodeName(id) || '-'}${game.camera.travelling ? ' (travelling…)' : ''}\n` +
    `<span class="k">distance</span> ${formatDistance(dist)}\n` +
    `<span class="k">time</span> ${date}\n` +
    `<span class="k">fps</span> ${s.fps.toFixed(0)}${s.worker ? `  <span class="k">worker</span> ${s.worker}` : ''}\n` +
    `<span class="k">socket</span> ${game.socketState}\n` +
    `<span class="k">descriptions</span> ${s.dps.toFixed(2)}/s · ${(s.bps / 1024).toFixed(2)} KB/s\n` +
    `<span class="k">snapshot</span> ${s.snapshotLoadMs !== null ? (s.snapshotBytes/1024).toFixed(0) + ' KB in ' + s.snapshotLoadMs.toFixed(0) + ' ms' : 'loading…'}` + perf;
  timeLabel.textContent = game.timeOffset === 0 ? 'now' : (game.timeOffset > 0 ? '+' : '') + (game.timeOffset / 3600).toFixed(1) + 'h';
});
</script>
</body>
</html>
